<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europe Bike Trip Route</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="project-header">
                <h2>Trips</h2>
                <div class="project-header-actions">
                    <button id="delete-project-btn" class="action-btn" title="Delete Current Trip">🗑️</button>
                    <button id="rename-project-btn" class="action-btn" title="Rename Current Trip">✎</button>
                    <button id="new-project-btn" class="action-btn" title="Create New Trip">+</button>
                </div>
            </div>
            
            <div class="project-selector-container">
                <select id="project-select" class="project-select">
                    <!-- Project options will be injected here -->
                </select>
            </div>

            <div class="selection-actions">
                <button id="show-whole-trip" class="action-btn" style="width: 100%;">Show Whole Trip</button>
            </div>

            <div id="city-selector" class="city-selector">
                <!-- City items with drag/remove controls will be injected here -->
            </div>
        </aside>

        <div id="resizer" class="resizer"></div>

        <main class="content-area">
            <header>
                <h1 id="project-title">Bike Trip</h1>
                <p id="project-description">Tracking the journey</p>
            </header>

            <div id="stats-bar" class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Cycling Distance</span>
                    <span id="total-distance" class="stat-value">0 km</span>
                    <div id="distance-breakdown" class="stat-breakdown">
                        <!-- Breakdown hidden -->
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Days</span>
                    <span id="total-days" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Elevation Gain</span>
                    <span id="total-elevation" class="stat-value">0 m</span>
                </div>
            </div>

            <div id="overview-map" class="overview-map">
                <!-- Overview map injected here -->
            </div>

            <div id="trip-summary" class="trip-summary" style="display: none;">
                <div class="trip-summary-header">
                    <h2 class="trip-summary-title">🗓️ Trip Summary</h2>
                    <button id="copy-summary-btn" class="action-btn copy-btn">📋 Copy Summary</button>
                </div>
                <!-- Trip summary injected here -->
            </div>

            <div id="route-container" class="route-container">
                <!-- Route segments will be injected here by script.js -->
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Bike Trip Journal</p>
    </footer>

    <!-- Use Maps JavaScript API for calculations with recommended async pattern -->
    <script>
      window.CONFIG = {
          GOOGLE_MAPS_API_KEY: "AIzaSyAAG5kdjT5rB6c1drjH4n7DKpn0_ox8tDs"
      };

      (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Re-verting to legacy usage."):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
        key: window.CONFIG.GOOGLE_MAPS_API_KEY,
        v: "weekly",
      });
    </script>
    <!-- Project Modal -->
    <div id="project-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Create New Trip</h2>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modal-project-name">Trip Name</label>
                    <input type="text" id="modal-project-name" placeholder="e.g. Summer in the Alps">
                </div>
                <div class="form-group">
                    <label for="modal-project-desc">Description (optional)</label>
                    <textarea id="modal-project-desc" placeholder="A short description of your journey..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel" class="action-btn">Cancel</button>
                <button id="modal-save" class="action-btn primary">Save Trip</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
